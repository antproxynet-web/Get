<section class="view-inicio">

  <!-- ===== CABEÇALHO ===== -->
  <header class="ui-head">
    <div class="ui-head__text">
      <span class="ui-eyebrow" id="currentDayName">—</span>
      <h2 class="ui-title">Seu dia</h2>
      <p class="ui-sub" id="summaryText">Carregando o resumo do seu dia...</p>
    </div>
    <span class="ui-tag ui-tag--solid plan-badge" data-plan-badge aria-hidden="true">
      <i class="fa-solid fa-sparkles"></i>Premium
    </span>
  </header>

  <!-- ===== AGORA / A SEGUIR ===== -->
  <section class="hero" aria-label="Aula atual e próxima aula">
    <div class="hero__panel">
      <div class="hero__eyebrow">
        <span class="status-dot" id="statusDot"></span>
        <span>Agora</span>
        <span class="ui-tag hero__status" id="statusBadge"><span id="statusText">Carregando</span></span>
      </div>
      <h3 class="hero__materia" id="currentAulaName">—</h3>
      <span class="hero__horario" id="heroCurrentHorario">—</span>
      <div class="ui-progress" id="heroProgressWrapper" role="progressbar" aria-label="Progresso da aula atual" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ui-progress__bar" id="heroProgressBar"></div>
      </div>
      <span class="hero__note" id="heroRemaining">—</span>
    </div>

    <div class="hero__panel hero__panel--next">
      <div class="hero__eyebrow hero__eyebrow--muted">
        <span class="status-dot off" aria-hidden="true"></span>
        <span>A seguir</span>
      </div>
      <h3 class="hero__materia hero__materia--next" id="nextAulaName">—</h3>
      <span class="hero__horario" id="heroNextHorario">—</span>
      <span class="hero__note hero__note--accent" id="heroCountdown">—</span>
    </div>
  </section>

  <!-- ===== INDICADORES DO DIA ===== -->
  <div class="ui-stats day-stats" role="group" aria-label="Resumo do dia">
    <div class="ui-stat">
      <span class="ui-stat__value" id="totalAulas">—</span>
      <span class="ui-stat__label">Aulas hoje</span>
    </div>
    <div class="ui-stat">
      <span class="ui-stat__value" id="aulasConcluidas">—</span>
      <span class="ui-stat__label">Concluídas</span>
    </div>
    <div class="ui-stat">
      <span class="ui-stat__value" id="aulasRestantes">—</span>
      <span class="ui-stat__label">Restantes</span>
    </div>
    <div class="day-stats__foot">
      <div class="ui-progress" id="progressWrapper" role="progressbar" aria-label="Progresso do dia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="ui-progress__bar" id="progressBar"></div>
      </div>
      <span class="day-stats__pct" id="progressLabel">0%</span>
    </div>
  </div>

  <!-- ===== ATALHOS ===== -->
  <nav class="quick-actions" aria-label="Atalhos rápidos">
    <button class="quick-action" id="qaGrade" type="button">
      <span class="ui-tile quick-action__icon" aria-hidden="true"><i class="fa-solid fa-table-cells"></i></span>
      <span class="quick-action__label">Grade</span>
    </button>
    <button class="quick-action" id="qaAgenda" type="button">
      <span class="ui-tile quick-action__icon" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span>
      <span class="quick-action__label">Agenda</span>
    </button>
    <button class="quick-action" id="qaNotas" type="button">
      <span class="ui-tile quick-action__icon" aria-hidden="true"><i class="fa-solid fa-bookmark"></i></span>
      <span class="quick-action__label">Notas</span>
    </button>
    <button class="quick-action" id="qaMaterial" type="button">
      <span class="ui-tile quick-action__icon" aria-hidden="true"><i class="fa-solid fa-book-bookmark"></i></span>
      <span class="quick-action__label">Material</span>
    </button>
    <button class="quick-action" id="qaAjustes" type="button">
      <span class="ui-tile quick-action__icon" aria-hidden="true"><i class="fa-solid fa-gear"></i></span>
      <span class="quick-action__label">Ajustes</span>
    </button>
  </nav>

  <!-- ===== SUA SEMANA ===== -->
  <section class="week-section" aria-label="Sua semana">
    <div class="section-header">
      <h3 class="section-title">Sua semana</h3>
      <span class="section-subtitle">Aulas por dia</span>
    </div>
    <div class="week-strip" id="weekStrip"><!-- via JS --></div>
  </section>

  <div class="home-layout">

    <!-- ===== COLUNA PRINCIPAL ===== -->
    <div class="home-main">

      <section class="compromissos-section" aria-label="Próximos compromissos">
        <div class="section-header">
          <h3 class="section-title">Próximos compromissos</h3>
          <button class="link-btn" id="btnVerAgenda" type="button">Ver todos<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </div>
        <div class="ui-panel" id="compromissosList"><!-- via JS --></div>
      </section>

      <section class="schedule-section" aria-label="Tabela de horários semanais">
        <div class="section-header">
          <h3 class="section-title">Grade horária</h3>
          <div class="section-header__actions">
            <button id="btnImportarGrade" type="button" class="ui-icon-btn" title="Importar grade via JSON" aria-label="Importar grade horária via JSON">
              <i class="fa-solid fa-file-import" aria-hidden="true"></i>
            </button>
            <button id="btnEditarGrade" type="button" class="ui-icon-btn ui-icon-btn--solid" title="Editar grade horária" aria-label="Editar grade horária">
              <i class="fa-solid fa-pencil" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="table-wrapper" role="region" aria-label="Tabela de horários" tabindex="0">
          <table class="schedule-table" id="scheduleTable">
            <thead>
              <tr id="tableHeader">
                <th scope="col" class="col-horario">Horário</th>
                <!-- Dias preenchidos via JS -->
              </tr>
            </thead>
            <tbody id="tableBody"><!-- Linhas preenchidas via JS --></tbody>
          </table>
        </div>
      </section>

    </div>

    <!-- ===== COLUNA LATERAL ===== -->
    <aside class="home-aside">

      <section aria-labelledby="aulasHojeTitulo">
        <div class="section-header">
          <h3 class="section-title" id="aulasHojeTitulo">Aulas de hoje</h3>
        </div>
        <div class="ui-panel">
          <ul class="lesson-list" id="aulasHoje" aria-label="Lista de aulas de hoje">
            <li class="lesson lesson--note">Carregando...</li>
          </ul>
        </div>
      </section>

      <section aria-labelledby="materiaisHojeTitulo">
        <div class="section-header">
          <h3 class="section-title" id="materiaisHojeTitulo">Materiais</h3>
          <span class="section-subtitle">Para levar</span>
        </div>
        <div class="ui-panel">
          <ul class="lesson-list" id="materiaisCard" aria-label="Lista de materiais do dia">
            <li class="lesson lesson--note">Carregando...</li>
          </ul>
        </div>
      </section>

    </aside>
  </div>

</section>
