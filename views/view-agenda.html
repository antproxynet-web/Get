<section class="view-agenda">
    <!-- ===== PAINEL DE AVISOS ===== -->
    <section class="avisos-section" aria-label="Avisos e tarefas importantes">
      <div class="section-header">
        <span class="section-icon" aria-hidden="true">⚑</span>
        <h2 class="section-title">Avisos & Tarefas</h2>
        <span class="section-subtitle">Fique atento</span>
      </div>
      <div class="avisos-grid" id="avisosGrid">
        <!-- Preenchido via JS -->
      </div>
    </section>

    <!-- ===== SEÇÃO: MINHAS ANOTAÇÕES ===== -->
    <section class="home-notes-section" aria-label="Minhas anotações">
      <div class="section-header">
        <span class="section-icon" aria-hidden="true"><i class="fa-solid fa-note-sticky"></i></span>
        <h2 class="section-title">Anotações</h2>
        <span class="section-subtitle">Suas notas rápidas</span>
        <button type="button" class="grade-btn grade-btn--primary" style="margin-left:auto" id="btnNovaNotaAgenda" aria-label="Nova anotação">
          <i class="fa-solid fa-plus"></i> Nova nota
        </button>
      </div>
      <div class="home-notes-grid" id="homeNotesGrid">
        <!-- Preenchido via JS -->
      </div>
      <div class="home-notes-empty" id="homeNotesEmpty">
        <div style="font-size:2rem;margin-bottom:.5rem"><i class="fa-solid fa-pen"></i></div>
        <strong style="color:var(--text-secondary);display:block;margin-bottom:.25rem">Nenhuma anotação</strong>
        <span>Clique em "Nova nota" para criar sua primeira anotação.</span>
      </div>
    </section>

</section>
