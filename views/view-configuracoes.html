<section class="view-configuracoes">

  <!-- ===== CATEGORIA: APARÊNCIA ===== -->
  <section class="config-section" aria-label="Aparência">
    <div class="section-header">
      <span class="section-icon" aria-hidden="true"><i class="fa-solid fa-palette"></i></span>
      <h2 class="section-title">Aparência</h2>
      <span class="section-subtitle">Personalize a interface</span>
    </div>
    <div class="config-list">
      <button class="config-item config-item--action" id="btnStyleThemes" type="button">
        <div class="config-item__info">
          <span class="config-item__icon" aria-hidden="true"><i class="fa-solid fa-swatchbook"></i></span>
          <div>
            <div class="config-item__title">Style Themes</div>
            <div class="config-item__desc">Escolha entre 8 temas visuais completos</div>
          </div>
        </div>
        <span class="config-item__chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
      </button>
    </div>
  </section>

  <!-- ===== CATEGORIA: GRADE HORÁRIA E DADOS ===== -->
  <section class="config-section" aria-label="Grade horária e dados">
    <div class="section-header">
      <span class="section-icon" aria-hidden="true"><i class="fa-solid fa-database"></i></span>
      <h2 class="section-title">Grade Horária &amp; Dados</h2>
      <span class="section-subtitle">Editar, importar e exportar</span>
    </div>
    <div class="config-list">
      <button class="config-item config-item--action" id="btnConfigEditarGrade" type="button">
        <div class="config-item__info">
          <span class="config-item__icon" aria-hidden="true"><i class="fa-solid fa-pencil"></i></span>
          <div>
            <div class="config-item__title">Editar grade horária</div>
            <div class="config-item__desc">Preencher matérias manualmente</div>
          </div>
        </div>
        <span class="config-item__chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
      </button>

      <button class="config-item config-item--action" id="btnConfigImportarGrade" type="button">
        <div class="config-item__info">
          <span class="config-item__icon" aria-hidden="true"><i class="fa-solid fa-file-import"></i></span>
          <div>
            <div class="config-item__title">Importar backup (JSON)</div>
            <div class="config-item__desc">Restaurar grade, tema e anotações</div>
          </div>
        </div>
        <span class="config-item__chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
      </button>

      <button class="config-item config-item--action" id="btnConfigExportarGrade" type="button">
        <div class="config-item__info">
          <span class="config-item__icon" aria-hidden="true"><i class="fa-solid fa-file-export"></i></span>
          <div>
            <div class="config-item__title">Exportar backup (JSON)</div>
            <div class="config-item__desc">Salvar uma cópia de segurança</div>
          </div>
        </div>
        <span class="config-item__chevron" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
      </button>
    </div>
  </section>

  <!-- ===== CATEGORIA: LOCALIZAÇÃO ===== -->
  <section class="config-section" aria-label="Localização">
    <div class="section-header">
      <span class="section-icon" aria-hidden="true"><i class="fa-solid fa-location-dot"></i></span>
      <h2 class="section-title">Localização</h2>
      <span class="section-subtitle">Fuso horário de referência</span>
    </div>
    <div class="config-list">
      <div class="config-item">
        <div class="config-item__info">
          <span class="config-item__icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
          <div>
            <div class="config-item__title" id="configLocationText">Araruna-PB</div>
            <div class="config-item__desc">Horário de Brasília (UTC-3)</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== CATEGORIA: SOBRE ===== -->
  <section class="config-section" aria-label="Sobre o aplicativo">
    <div class="section-header">
      <span class="section-icon" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></span>
      <h2 class="section-title">Sobre</h2>
    </div>
    <div class="config-about">
      <span class="config-about__brand">◈ AgendaEscolar Inteligente</span>
      <span class="config-about__info">Atualizado em tempo real · Horário de Brasília (UTC-3)</span>
      <span class="config-about__version">Versão 4.0 · <span id="configFooterYear">2026</span></span>
    </div>
  </section>

</section>
