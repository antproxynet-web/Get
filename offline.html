<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Agenda Escolar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #222222;
      color: #d8d8d8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; opacity: .6; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #f2f2f2; }
    p { font-size: .95rem; color: #8f8f8f; max-width: 320px; line-height: 1.6; }
    button {
      margin-top: .5rem;
      padding: .75rem 1.75rem;
      background: #333333;
      color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #3c3c3c; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Você está offline</h1>
  <p>Sem conexão com a internet. Verifique seu Wi-Fi ou dados móveis e tente novamente.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
